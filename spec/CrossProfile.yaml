- Ontology:
    Name: CrossProfile
    Doc: Domain-agnostic cross-profile definitions along alignments.
    Meta:
        Uri: https://w3id.org/piip/CrossProfile/1
        Organization: A+S Consult GmbH FuE
        OrganizationUri: https://apluss.de/a+s_consult
        Version: 1.0.0
        Creators: [ Jens Bartnitzek ]
    LinkedOntologies:
        - Core:
            Uri: https://w3id.org/piip/Core/1
        - Positioning:
            Uri: https://w3id.org/piip/Positioning/1
            Prefix: pos
        - Alignment:
            Uri: https://w3id.org/piip/Alignment/1
            Prefix: align
        - Geometry:
            Uri: https://w3id.org/piip/Geometry/1
            Prefix: geo
    Enums:
        - CrossProfileInterpolation:
            Doc: Interpolation mode between corresponding points in adjacent CrossProfileSections.
            Values: [
              Linear,
              ConstantFromSource,
              ConstantToTarget ]
    ValueTypes:
        - CrossProfilePoint:
            Doc: Single point in a cross-profile with offset, height, and interpolation to the next section.
            Members:
                - LengthValue offset
                - LengthValue height
                - CrossProfileInterpolation interpolation
        - CrossProfileLine:
            Doc: Typed sequence of CrossProfilePoints within a CrossProfileSection.
            Members:
                - Link<CrossProfileTypeDefinitionArchetype> type
                - List<CrossProfilePoint> points
        - CrossProfileSection:
            Doc: Complete cross-profile at a single station, composed of typed lines.
            Members:
                - align:StationValue station
                - List<CrossProfileLine> lines
    Components:
        - CrossProfileTypeDefinitionComponent:
            Doc: Marker identifying an Entity as a named cross-profile line type.
        - CrossProfileDefinitionComponent:
            Doc: Ordered cross-profile sections along an alignment with per-point interpolation. The alignment reference is provided structurally via AlignmentConsumerArchetype.
            Members:
                - List<CrossProfileSection> sections
        - CrossProfileTypeVolumeComponent:
            Doc: Binds a volume entity to a cross-profile line type, a discretization, and a cross-profile definition. The Sweep-System generates the MeshGeometry3DComponent from these references.
            Members:
                - Link<CrossProfileTypeDefinitionArchetype> profileType
                - Link<align:DiscretizationArchetype> discretization
                - Link<CrossProfileDefinitionArchetype> profileDefinition
    Archetypes:
        - CrossProfileTypeDefinitionArchetype:
            Doc: Reusable, named definition of a cross-profile line type.
            Includes: [ NamedArchetype ]
            Components: [ CrossProfileTypeDefinitionComponent ]
        - CrossProfileDefinitionArchetype:
            Doc: Versioned cross-profile definition along an alignment.
            Includes: [ NamedArchetype, pos:AlignmentConsumerArchetype ]
            Components: [ CrossProfileDefinitionComponent ]
        - CrossProfileTypeVolumeArchetype:
            Doc: Volume entity generated by sweeping a single cross-profile line type along a discretized alignment. Carries the resulting mesh geometry. Generic — the profile type is user-defined via CrossProfileTypeDefinitionArchetype.
            Includes: [ NamedArchetype, geo:MeshGeometry3DArchetype ]
            Components: [ CrossProfileTypeVolumeComponent ]

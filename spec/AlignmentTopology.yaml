- Ontology:
    Name: AlignmentTopology
    Doc: >-
      Alignment-specific topology: links the domain-agnostic Topology ontology
      with the Alignment ontology by providing Components and Archetypes for
      alignment-referenced nodes and edges (micro-topology).
    Meta:
        Uri: https://w3id.org/piip/AlignmentTopology/1
        Organization: A+S Consult GmbH FuE
        OrganizationUri: https://apluss.de/a+s_consult
        Version: 1.0.0
        Creators: [ Jens Bartnitzek ]
    LinkedOntologies:
        - Core:
            Uri: https://w3id.org/piip/Core/1
        - Topology:
            Uri: https://w3id.org/piip/Topology/1
            Prefix: topo
        - Alignment:
            Uri: https://w3id.org/piip/Alignment/1
            Prefix: align
    Components:
        - AlignmentNodeComponent:
            Doc: Extends a topological node with a reference to a specific station on an alignment. Used in micro-topologies to link the graph structure to the geometric alignment. The alignment is derivable from relatedStation.StationComponent.alignment.
            Members:
                - Link<align:StationArchetype> relatedStation
        - AlignmentEdgeComponent:
            Doc: Extends a topological edge with a reference to an alignment section and a direction flag. Used in micro-topologies to link the graph structure to the geometric alignment.
            Members:
                - Link<align:AlignmentSectionArchetype> relatedSection
                - topo:EdgeDirection direction
    Archetypes:
        - AlignmentNodeArchetype:
            Doc: Topological node at a specific station on an alignment. Combines the abstract NodeArchetype with alignment-specific positioning.
            Includes: [ topo:NodeArchetype ]
            Components: [ AlignmentNodeComponent ]
        - AlignmentEdgeArchetype:
            Doc: Topological edge along a section of an alignment with direction. Combines the abstract EdgeArchetype with alignment-specific section reference.
            Includes: [ topo:EdgeArchetype ]
            Components: [ AlignmentEdgeComponent ]

- Ontology:
    Name: Reference
    Doc: Musterobjekte, Baugruppen and product instances.
    Meta:
        Uri: https://w3id.org/piip/Reference/1
        Organization: A+S Consult GmbH FuE
        OrganizationUri: https://apluss.de/a+s_consult
        Version: 1.0.0
        Creators: [ Jens Bartnitzek ]
    LinkedOntologies:
        - Core:
            Uri: https://w3id.org/piip/Core/1
        - Geometry:
            Uri: https://w3id.org/piip/Geometry/1
            Prefix: geo
    ValueTypes:
        - ReferencePartItem:
            Doc: Placement and reference to a single part within an assembly.
            Members:
                - Optional<geo:AffineTransformation3D> localPlacement
                - Link<ReferenceArchetype> referenceObject
    Components:
        - ReferenceGeometryComponent:
            Doc: Geometry and local placement of a reference part (prototype). Defined once (SSoT) and reused in multiple product instances.
            Members:
                - Optional<geo:AffineTransformation3D> localPlacement
                - Link<geo:MeshGeometry3DArchetype> geometry
        - ReferenceAssemblyComponent:
            Doc: Collection of reference parts forming a hierarchical assembly structure. Enables nested compositions of reusable prototypes.
            Members:
                - Set<ReferencePartItem> parts
        - ReferencePartComponent:
            Doc: Reference to a single part within an assembly, including its local placement relative to the assembly origin.
            Members:
                - Optional<geo:AffineTransformation3D> localPlacement
                - Link<ReferenceArchetype> referenceObject
        - ProductInstanceComponent:
            Doc: Links a domain Entity to a reference object (prototype), realizing the instantiation of a standardized component in a specific planning context.
            Members:
                - Member:
                    Name: referenceObject
                    Type: Link<ReferenceArchetype>
                    Doc: Domain reference to the ReferenceArchetype Entity used as prototype.
    Archetypes:
        - ReferenceArchetype:
            Doc: Single reference part (prototype) with geometry, defined once and reused across planning instances.
            Includes: [ LifecycleArchetype ]
            Components: [ ReferenceGeometryComponent ]
        - ReferenceAssemblyArchetype:
            Doc: Assembly of multiple reference parts forming a hierarchical structure with own geometry.
            Includes: [ ReferenceArchetype ]
            Components: [ ReferenceAssemblyComponent ]
        - ProductInstanceArchetype:
            Doc: Domain object instantiated through a reference object (prototype).
            Includes: [ LifecycleArchetype ]
            Components: [ ProductInstanceComponent ]
